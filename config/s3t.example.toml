# Self-3-Trader configuration: example.
#
# Every value that depends on the machine lives in this file, never in code (GEN-08).
# Copy it to config/s3t.toml (git-ignored), or anywhere else and name that file in the
# S3T_CONFIG environment variable, then edit the values.
#
# Relative paths are resolved against the directory of the file they are written in;
# "~" is expanded. Unknown keys are refused.

[server]
# One IP address to listen on. A wildcard such as 0.0.0.0 or :: is refused: the backend
# never listens on all interfaces (SEC-03). Use the machine's LAN address to reach it from
# other devices on the VPN; the loopback address keeps it on this machine.
listen_address = "127.0.0.1"
port = 8740

# Optional. The host name the browser uses to reach the backend. The backend accepts the pages of
# this name and of the listen address, and of no other origin (SEC-02). Without it, only the listen
# address is accepted: to open the app as "localhost", name that here.
# host_name = "trader.example.internal"

[paths]
# The environment file with the broker secrets. It must be readable by the backend user
# only and is never committed (GEN-02, GEN-07).
env_file = "../.env"

# Downloads, caches and local recordings. Market data never enters the repository: inside
# the repository only the git-ignored data/ directory may be used (GEN-07).
data_dir = "../data"

# The SQLite state store: login, settings, tickets, watchlists, drawings (STO-01).
state_file = "../data/state.sqlite"

# Optional. Where copies of the state store go (STO-07): those of tools/state_backup.py and those
# made before a migration. Without it: the directory "backups" beside the state store. Nothing
# deletes old copies, except the daily ones ([store] below).
# backup_dir = "../data/backups"

# Optional. The read-only T3 store (STO-04). Features that need it are hidden or marked
# unavailable when it is absent (GEN-04).
# t3_root = "~/stores/t3"

# Optional. The built frontend that the backend serves (SEC-07). Without it: frontend/dist of the
# repository the backend runs from.
# frontend_dir = "../frontend/dist"

[broker]
# Optional. The broker the backend runs on (GEN-11): "live", "fake" (the synthetic market) or
# "replay" (a local recording). On the fake and the replay the app marks every screen.
# source = "live"
# The recording to replay, below data_dir/recordings. Needed for source = "replay" only.
# recording = "NAME"
# The instant at which the synthetic market's clock starts, for source = "fake" only. Without it the
# clock is the wall clock, and the synthetic market moves in the regular session only.
# fake_start = 2026-11-20T15:00:00Z
# What the app shows for the account. Never the account number (GEN-03).
# account_nickname = "main"
# Optional. The REST client's request limit (BRK-04): an average rate in requests per second
# and the burst allowed after a quiet spell. The broker's real limits are measured at WP-0.9.
# rest_rate = 2.0
# rest_burst = 4

[stream]
# Optional. The streaming session (BRK-02, BRK-03).
# The aggregation period asked of the feed, in seconds. The server grants it or its own.
# aggregation_period = 0.5
# Seconds without data, while the market is open and something is subscribed, after which
# the session is taken for stalled and opened again.
# stall_after = 60.0

[subscriptions]
# Optional. The subscription budget (SUB-02). It counts symbol and event pairs; each reserve
# is kept free.
# limit is the application's own, well below the broker's published 25,000, so that the
# broker's own app and other programs on the same account have room. Raise it when needed.
# The session refuses beyond limit. The manager grants up to limit less reserve: 10,000.
# limit = 11000
# reserve = 1000
# The candle and change limits are the broker's published ones.
# candle_limit = 100
# candle_reserve = 5
# changes_per_minute = 10000
# change_reserve = 2000

[calendar]
# Optional. Days on which the exchanges are closed and the installed calendar package does not
# know it, such as a day of mourning announced ten days before (REF-04).
# closures = [2025-01-09]

[rates]
# Optional. The rate curve (REF-01): SOFR and Treasury yields from FRED, without a key.
# With download = false nothing is downloaded: what was downloaded before is used, and then the
# flat rate.
# download = true
# Hours from a complete download to the next one.
# refresh_hours = 12.0
# A series whose latest value is older than this many days is left out of the curve.
# max_age_days = 10
# The fallback: one continuously compounded rate, as a fraction (0.04 is 4%).
# flat_rate = 0.04

[login]
# Optional. Days from a login to the end of its session (SEC-01). The password is set with
# tools/set_password.py.
# session_days = 30

[store]
# Optional. Daily copies of the state store that are kept in backup_dir; 0 makes none. Only these
# copies are ever deleted, the oldest first.
# daily_copies = 14
