// The option chain of one underlying, for the `chain` topic (WP-1.2; MKT-04 to MKT-06, PRC-13,
// REF-03, SUB-05). Decided 2026-11-28 (requirements, section 3, "The chain package"). The topic,
// its windows and the message of the topic are in channel.proto.
//
// A subscription names the underlying and its windows: an expiration and a range of strikes
// each. The backend subscribes those contracts only, never a whole chain. The snapshot carries
// every open expiration of the underlying and the rows of the windows; later messages carry what
// changed. A whole expiration, every strike, comes over REST as Arrow (API-06), with the columns
// of ChainRows.
//
// The rules of market.proto hold for numbers, instants and columns. Greeks are spot Greeks in
// trader units with a multiplier and a quantity of 1, that is per share: delta as a fraction,
// gamma per dollar of the underlying, theta in dollars a calendar day, vega in dollars a
// volatility point (requirements 4.6). A date is ISO text, `2026-12-18`.

syntax = "proto3";

package s3t.wire.v1;

message ChainHead {
  string underlying = 1;
  // stock, etf or index; empty while the broker has not been asked.
  string kind = 2;
  // The price of the underlying that the values belong to.
  optional double spot = 3;
  // quote (the mid of a stock's or an ETF's quote), trade (the last trade: always for an index,
  // whose quote is too wide to be a price), or none.
  string spot_source = 4;
  double data_time_us = 5;
  // A quote older than this is marked stale (MKT-06).
  double stale_after_s = 6;
  // The next earnings report the broker states: a date, empty when it states none ahead.
  string earnings = 7;
  // before_open, after_close, or empty when the broker does not say.
  string earnings_time = 8;
  optional bool earnings_estimated = 9;
}

message ChainExpiration {
  uint32 index = 1;
  string key = 2;
  string root = 3;
  string date = 4;
  // am or pm.
  string settlement = 5;
  // The instant its options are priced to; unset when the calendar cannot give it.
  optional double settles_at_us = 6;
  // regular, weekly, quarterly, end_of_month or other.
  string kind = 7;
  double multiplier = 8;
  // False for an adjusted root: no forward of its own, no own IV, no surface.
  bool standard = 9;
  // The strikes listed, which the Arrow snapshot of the expiration holds.
  uint32 strikes = 10;
  optional double forward = 11;
  // parity, model, or none.
  string forward_source = 12;
  // The surface's at-the-money IV; unset without a fit.
  optional double atm_iv = 13;
  // In price units of the underlying, and the name of its rule.
  optional double expected_move = 14;
  string expected_move_method = 15;
  // The broker's IV of the expiration. It is the broker's figure, never mixed with the own one.
  optional double broker_iv = 16;
  // The ex-dividend dates after today up to the expiration date, and whether each is projected
  // from the last one the broker stated (REF-02).
  repeated string ex_dividend = 17;
  repeated bool ex_dividend_projected = 18;
  // The next earnings report falls before the settlement instant.
  bool earnings_before = 19;
  // Why its contracts have no own IV, if that holds for all of them; empty otherwise.
  string note = 20;
}

enum GreeksSource {
  GREEKS_SOURCE_UNSPECIFIED = 0;
  // Computed by the backend from the contract's quote (PRC-13).
  GREEKS_SOURCE_OWN = 1;
  // The broker's, where the own inversion failed. Shown marked as such.
  GREEKS_SOURCE_BROKER = 2;
  // Neither: no quote, no IV, or the expiration has settled.
  GREEKS_SOURCE_NONE = 3;
}

// One row per strike of a window. The columns of both sides have the length of the row columns.
message ChainRows {
  repeated uint32 expiration = 1;
  repeated double strike = 2;
  // The out-of-the-money side's IV: the call at or above the forward, the put below it.
  repeated double iv = 3;
  ChainSide call = 4;
  ChainSide put = 5;
}

// The contracts of one side of the rows. Where a side is not listed its symbol is empty and its
// numbers are NaN.
message ChainSide {
  repeated string symbol = 1;
  repeated double bid = 2;
  repeated double ask = 3;
  repeated double bid_size = 4;
  repeated double ask_size = 5;
  // The time the age of the quote runs from: its own where the feed gives one, else its receipt.
  repeated double quote_us = 6;
  repeated bool stale = 7;
  repeated double iv = 8;
  repeated double delta = 9;
  repeated double gamma = 10;
  repeated double theta = 11;
  repeated double vega = 12;
  repeated GreeksSource source = 13;
  repeated double volume = 14;
  repeated double open_interest = 15;
}
