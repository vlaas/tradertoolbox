// Rows of market values for the browser (MKT-03, MKT-07, GEN-10; WP-0.5).
//
// The rules for every message with columns, here and in the topics that follow (proposed
// 2026-11-24, requirements section 3):
//
// - Rows travel as columns. Every column of a message has one entry per row, so all columns
//   have one length, and row i is the i-th entry of each. A reader refuses a message whose
//   columns differ in length.
// - A missing number is NaN. It is never zero, and it is never left out: a column that
//   skipped its missing entries would shift the rows. Zero is always a value.
// - An instant is microseconds since 1970 in UTC, as a double. A double holds every
//   microsecond exactly until the year 2255, and a JavaScript number is a double; int64 would
//   arrive as bigint. A missing instant is NaN, by the rule above.
// - A single number or instant outside a column is an `optional double`, unset when missing.
//
// A symbol on the wire is the application's, never the broker's stream symbol.

syntax = "proto3";

package s3t.wire.v1;

// The latest values of some instruments, for the `quotes` topic (WP-0.7). A message holds the
// rows that changed, each of them whole.
message QuoteRows {
  repeated string symbol = 1;
  repeated double bid = 2;
  repeated double ask = 3;
  repeated double bid_size = 4;
  repeated double ask_size = 5;
  // The price and the size of the last trade. An index has a price here and no size, and its
  // bid and ask are not prices.
  repeated double last = 6;
  repeated double last_size = 7;
  repeated double day_volume = 8;
  repeated double prev_close = 9;
  // When the backend received the quote, and when the trade.
  repeated double quote_received_us = 10;
  repeated double trade_received_us = 11;
}
