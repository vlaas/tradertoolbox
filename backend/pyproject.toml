[project]
name = "s3t"
version = "0.0.1"
description = "Self-3-Trader backend: broker connection, market state, numerics and the API"
requires-python = "==3.13.*"
dependencies = [
    "backports-zstd==1.8.0",
    "fastapi==0.162.2",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "protobuf==7.36.2",
    "pydantic==2.14.3",
    "scipy==1.18.1",
    "websockets==17.4",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
# The version rule (requirements, section 3; decided 2026-11-22): no package, direct or
# indirect, younger than two weeks. uv records the cutoff in uv.lock; `uv sync --locked`
# keeps accepting the lock on later days, and the cutoff moves only when the lock is resolved
# again. An urgent fix newer than that needs a named exclude-newer-package entry.
exclude-newer = "14 days"

[tool.uv.build-backend]
module-name = "s3t"

[dependency-groups]
dev = [
    "grpcio-tools==1.85.1",
    "hypothesis==6.170.15",
    "mpmath==1.4.1",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# First-party roots for import sorting: the package, the tests and the tools.
src = ["src", "tests", "tools"]
# Generated by tools/generate.py; checked for staleness instead of style. The frozen copy of
# volcalc's solver is kept byte for byte as its source wrote it (tests/pricing/test_bsm_bitexact.py).
extend-exclude = ["src/s3t/wire", "tests/pricing/_iv_reference.py"]

[tool.ruff.lint]
# ASYNC (blocking calls and other mistakes in async code): decided 2026-11-22. Bandit's S and
# the style families were measured and left out (requirements, section 3). The four DTZ rules
# guard GEN-10: no utcnow, now, fromtimestamp or today that depends on the machine's time zone
# (proposed 2026-11-24, WP-0.5).
select = [
    "E", "F", "I", "UP", "B", "ASYNC",
    "DTZ003", "DTZ005", "DTZ006", "DTZ011",
]

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = ["src/s3t/wire", "**/__pycache__", ".venv"]
extraPaths = ["tools", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
# -rs prints the reason of every skip, so a run with missing local data is never read as a
# full run (implementation plan, 3.2).
addopts = "-rs --strict-markers"
