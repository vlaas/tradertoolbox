[project]
name = "s3t"
version = "0.0.1"
description = "Self-3-Trader backend: broker connection, market state, numerics and the API"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.162.2",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "protobuf==7.36.2",
    "pydantic==2.14.3",
    "scipy==1.18.1",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "s3t"

[dependency-groups]
dev = [
    "grpcio-tools==1.85.1",
    "hypothesis==6.170.15",
    "mpmath==1.4.1",
    "pip-licenses==5.5.5",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# First-party roots for import sorting: the package, the tests and the tools.
src = ["src", "tests", "tools"]
# Generated by tools/generate.py; checked for staleness instead of style. The frozen copy of
# volcalc's solver is kept byte for byte as its source wrote it (tests/pricing/test_bsm_bitexact.py).
extend-exclude = ["src/s3t/wire", "tests/pricing/_iv_reference.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = ["src/s3t/wire", "**/__pycache__", ".venv"]
extraPaths = ["tools"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
# -rs prints the reason of every skip, so a run with missing local data is never read as a
# full run (implementation plan, 3.2).
addopts = "-rs --strict-markers"
